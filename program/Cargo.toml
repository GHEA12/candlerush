[package]
name = "candlerush"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
borsh = "1"
ephemeral-rollups-sdk = "0.18"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
